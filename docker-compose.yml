services:
  db:
    image: postgres:16-alpine
    container_name: review-responder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: review_responder
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d review_responder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
